name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Debug build
        run: ./gradlew :app:assembleDebug

      - name: Instrumentation test assembly
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Release assembly fails without signing credentials
        run: |
          set +e
          ./gradlew :app:assembleRelease > release-build.log 2>&1
          status=$?
          set -e
          cat release-build.log
          if [ "$status" -eq 0 ]; then
            echo "::error::assembleRelease succeeded without MAMA_RELEASE_* credentials"
            exit 1
          fi
          if ! grep -q "Release signing is not configured. Set MAMA_RELEASE_STORE_FILE" release-build.log; then
            echo "::error::assembleRelease failed for a reason other than missing signing credentials"
            exit 1
          fi
          if ! grep -q "Debug signing is never used for release builds." release-build.log; then
            echo "::error::expected fail-closed signing message missing from output"
            exit 1
          fi

      - name: Release BuildConfig embeds no NEIS key
        run: |
          ./gradlew :app:generateReleaseBuildConfig
          config=app/build/generated/source/buildConfig/release/kr/mom/probe/BuildConfig.java
          ! grep -q 'NEIS_API_KEY' "$config"

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: "35"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            avd-${{ env.API_LEVEL }}-

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          arch: x86_64
          profile: pixel_6
          avd-name: mama_ci_api${{ env.API_LEVEL }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          emulator-boot-timeout: 600
          script: echo "Generated AVD snapshot for caching."

      - name: connectedDebugAndroidTest on API ${{ env.API_LEVEL }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          arch: x86_64
          profile: pixel_6
          avd-name: mama_ci_api${{ env.API_LEVEL }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Summarize instrumentation XML results
        if: always()
        run: |
          files=$(find android/app/build/outputs/androidTest-results/connected -name '*.xml' -type f 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::No connectedDebugAndroidTest XML results under android/app/build/outputs/androidTest-results/connected"
            exit 1
          fi
          counts=$(echo "$files" | xargs grep -h -o '<testsuite [^>]*>' | awk '
            {
              line = $0
              t = 0; f = 0; e = 0; s = 0
              if (match(line, /tests="[0-9]+"/))    t = substr(line, RSTART + 7,  RLENGTH - 8)
              if (match(line, /failures="[0-9]+"/)) f = substr(line, RSTART + 10, RLENGTH - 11)
              if (match(line, /errors="[0-9]+"/))   e = substr(line, RSTART + 8,  RLENGTH - 9)
              if (match(line, /skipped="[0-9]+"/))  s = substr(line, RSTART + 9,  RLENGTH - 10)
              T += t; F += f; E += e; S += s
            }
            END { printf "%d %d %d %d", T, F, E, S }')
          read -r tests failures errors skipped <<< "$counts"
          passed=$((tests - failures - errors - skipped))
          {
            echo "## connectedDebugAndroidTest results (JUnit XML, authoritative)"
            echo ""
            echo "| tests | passed | failures | errors | skipped |"
            echo "|---|---|---|---|---|"
            echo "| $tests | $passed | $failures | $errors | $skipped |"
            echo ""
            echo "Counts are summed from the testsuite XML attributes, not the Gradle"
            echo "console total, which can differ (UTP reports skipped/reported events"
            echo "separately from testcase entries)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$tests" -eq 0 ]; then
            echo "::error::Instrumentation XML reports zero test cases"
            exit 1
          fi
          if [ "$failures" -gt 0 ] || [ "$errors" -gt 0 ]; then
            echo "::error::connectedDebugAndroidTest XML reports $failures failure(s) and $errors error(s)"
            exit 1
          fi
          echo "::notice::Instrumentation XML: $tests tests, $passed passed, $skipped skipped, $failures failures, $errors errors"

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connectedDebugAndroidTest-api${{ env.API_LEVEL }}
          path: |
            android/app/build/reports/androidTests/connected/**
            android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore

  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      MAMA_RELEASE_KEYSTORE_BASE64: ${{ secrets.MAMA_RELEASE_KEYSTORE_BASE64 }}
      MAMA_RELEASE_STORE_PASSWORD: ${{ secrets.MAMA_RELEASE_STORE_PASSWORD }}
      MAMA_RELEASE_KEY_ALIAS: ${{ secrets.MAMA_RELEASE_KEY_ALIAS }}
      MAMA_RELEASE_KEY_PASSWORD: ${{ secrets.MAMA_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Detect release signing secrets
        id: signing
        run: |
          if [ -n "$MAMA_RELEASE_KEYSTORE_BASE64" ] && [ -n "$MAMA_RELEASE_STORE_PASSWORD" ] && \
             [ -n "$MAMA_RELEASE_KEY_ALIAS" ] && [ -n "$MAMA_RELEASE_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Signed release skipped::MAMA_RELEASE_* secrets are not configured for this run. The fail-closed contract stays enforced by the verify job's negative test."
          fi

      - name: Materialize keystore from base64 secret
        id: keystore
        if: steps.signing.outputs.available == 'true'
        run: |
          printf '%s' "$MAMA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mama-release.keystore"
          test -s "$RUNNER_TEMP/mama-release.keystore"
          echo "path=$RUNNER_TEMP/mama-release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.available == 'true'
        env:
          MAMA_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Verify signed artifacts
        if: steps.signing.outputs.available == 'true'
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          aab=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          test -f "$apk" && test -f "$aab"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify "$aab"
          if ! grep -q "release" <<<"$(basename "$apk")"; then
            echo "::error::expected a release APK artifact, got $apk"
            exit 1
          fi

      - name: Upload signed release artifacts
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mama-signed-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
