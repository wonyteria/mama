name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Debug build
        run: ./gradlew :app:assembleDebug

      - name: Instrumentation test assembly
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Release assembly fails without signing credentials
        run: |
          set +e
          ./gradlew :app:assembleRelease > release-build.log 2>&1
          status=$?
          set -e
          cat release-build.log
          if [ "$status" -eq 0 ]; then
            echo "::error::assembleRelease succeeded without MAMA_RELEASE_* credentials"
            exit 1
          fi
          if ! grep -q "Release signing is not configured. Set MAMA_RELEASE_STORE_FILE" release-build.log; then
            echo "::error::assembleRelease failed for a reason other than missing signing credentials"
            exit 1
          fi
          if ! grep -q "Debug signing is never used for release builds." release-build.log; then
            echo "::error::expected fail-closed signing message missing from output"
            exit 1
          fi

      - name: Release BuildConfig embeds no NEIS key
        run: |
          ./gradlew :app:generateReleaseBuildConfig
          config=app/build/generated/source/buildConfig/release/kr/mom/probe/BuildConfig.java
          ! grep -q 'NEIS_API_KEY' "$config"
